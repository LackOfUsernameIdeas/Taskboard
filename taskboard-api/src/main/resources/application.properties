spring.datasource.url=jdbc:postgresql://localhost:5432/taskdb
spring.datasource.username=taskuser
spring.datasource.password=taskpass
spring.jpa.hibernate.ddl-auto=update

# JWT config - override app.jwt.secret via env var in real deployments, never commit a real secret
app.jwt.secret=${JWT_SECRET:change-this-dev-only-secret-key-min-32-bytes-long}
app.jwt.expiration-ms=3600000

# Initial admin account, seeded once at startup if no ADMIN user exists yet.
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}